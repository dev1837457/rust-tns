[workspace]
members = [
    "crates/tns-core",
    "crates/tns-cli",
    "crates/tns-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-1.1"
authors = ["TNS modernization contributors"]
publish = false
repository = "https://github.com/dev1837457/rust-tns"
homepage = "https://github.com/dev1837457/rust-tns"

[workspace.dependencies]
crc32fast = "1.4"
des = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
thiserror = "2.0"
